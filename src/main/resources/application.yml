spring:
  application:
    name: aideep

  data:
    redis:
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  profiles:
    default: local

logging:
  level:
    root: INFO
    com.aideep.global.exception.GlobalExceptionHandler: ERROR
    com.aideep.global.config.SecurityConfig: ERROR
    com.aideep.domain.auth: ERROR

auth:
  jwt-secret: ${JWT_SECRET:}
  frontend-url: ${FRONTEND_URL:}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  google-callback-url: ${GOOGLE_CALLBACK_URL:}
  google-authorize-url: https://accounts.google.com/o/oauth2/v2/auth
  google-token-url: https://oauth2.googleapis.com/token
  google-user-info-url: https://openidconnect.googleapis.com/v1/userinfo
  mail-user: ${MAIL_USER:}
  mail-pass: ${MAIL_PASS:}
  master-user-ids: ${MASTER_USER_IDS:}
  demo-secret: ${DEMO_SECRET:}
  demo-workspace-id: ${DEMO_WORKSPACE_ID:}

recall:
  api-url: ${RECALL_API_URL:https://us-east-1.recall.ai/api/v1/bot/}
  api-key: ${RECALL_API_KEY:}
  bot-name: ${RECALL_BOT_NAME:AIDEEP Meeting Notetaker}

node:
  events:
    enabled: ${NODE_EVENTS_ENABLED:true}
    stream-key: ${NODE_EVENTS_STREAM_KEY:onnode:ai:commands:v1}
    dlq-stream-key: ${NODE_EVENTS_DLQ_STREAM_KEY:onnode:ai:commands:dlq:v1}
    retry-key: ${NODE_EVENTS_RETRY_KEY:onnode:ai:commands:retries:v1}
    consumer-group: ${NODE_EVENTS_CONSUMER_GROUP:aideep-node-command-workers-v1}
    consumer-name: ${NODE_EVENTS_CONSUMER_NAME:}
    batch-size: ${NODE_EVENTS_BATCH_SIZE:1}
    block-timeout: ${NODE_EVENTS_BLOCK_TIMEOUT:2s}
    reclaim-min-idle: ${NODE_EVENTS_RECLAIM_MIN_IDLE:30s}
    reclaim-interval: ${NODE_EVENTS_RECLAIM_INTERVAL:30s}
    max-attempts: ${NODE_EVENTS_MAX_ATTEMPTS:5}
    dlq-max-length: ${NODE_EVENTS_DLQ_MAX_LENGTH:100000}
